<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF5722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Melidan - Carta Digital</title>
  <meta name="description" content="Carta gastronómica interactiva de Restaurante Melidan.">

  <!-- Controlador Anti-FOUC de Tema Oscuro y Guardián de Roles RBAC -->
  <script src="/js/theme.js"></script>
  <script src="/js/rbac.js"></script>

  <!-- Fuentes Google: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/carta.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>

  <main class="app-container app-container-wide carta-shell">

    <!-- Cabecera Melidan + Mesa #04 + Navegación según Rol -->
    <header class="carta-header">
      <div class="d-flex align-items-center gap-2">
        <span class="brand-logo" style="cursor: default;">Melidan<span class="dot">.</span></span>
        <span class="badge bg-light text-secondary border small d-none d-md-inline rbac-user-badge">Carta</span>
      </div>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <button type="button" class="carta-mesa-pill" id="carta-mesa-btn" onclick="cartaApp.openMesaSelector()" title="Cambiar mesa asignada">
          <span id="carta-mesa-label">Mesa #04</span>
        </button>

        <!-- Solo visible para Mozo y Admin -->
        <a href="/mozo.html" class="btn btn-sm btn-melidan-outline" data-allowed-roles="ADMIN,WAITER" title="Ir a Control de Mesas">
          <i class="bi bi-grid-3x3-gap-fill text-success"></i>
          <span class="d-none d-sm-inline">Mesas</span>
        </a>

        <!-- Solo visible para Admin -->
        <a href="/admin.html" class="btn btn-sm btn-melidan-outline" data-allowed-roles="ADMIN" title="Volver al Panel Admin">
          <i class="bi bi-speedometer2 text-danger"></i>
          <span class="d-none d-sm-inline">Admin</span>
        </a>

        <button type="button" class="theme-toggle-btn" title="Alternar Modo Oscuro" aria-label="Alternar Modo Oscuro">
          <i class="bi bi-moon-stars-fill"></i><span class="d-none d-sm-inline ms-1 small">Oscuro</span>
        </button>

        <a href="/login" class="btn btn-sm btn-outline-danger btn-logout-melidan" title="Cerrar Sesión">
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-md-inline ms-1">Salir</span>
        </a>
      </div>
    </header>

    <!-- Cuerpo Principal de la Carta -->
    <div class="carta-body">
      <!-- Buscador -->
      <div class="carta-search-wrap">
        <i class="bi bi-search"></i>
        <input
          type="search"
          id="carta-search-input"
          class="carta-search-input"
          placeholder="Buscar plato o bebida..."
          autocomplete="off"
        >
      </div>

      <!-- Categorías -->
      <div class="carta-categories-bar" id="carta-categories-bar">
        <button type="button" class="carta-cat-pill active" data-category="Todos">Todos</button>
        <button type="button" class="carta-cat-pill" data-category="Entradas">Entradas</button>
        <button type="button" class="carta-cat-pill" data-category="Platos de Fondo">Platos de Fondo</button>
        <button type="button" class="carta-cat-pill" data-category="Bebidas">Bebidas</button>
        <button type="button" class="carta-cat-pill" data-category="Especialidades al Horno">Especialidades al Horno</button>
        <button type="button" class="carta-cat-pill" data-category="Postres">Postres</button>
      </div>

      <!-- Título Dinámico -->
      <div class="carta-section-header">
        <h2 class="carta-section-title" id="carta-section-title">Populares hoy</h2>
        <small class="text-muted fw-semibold" id="carta-results-count"></small>
      </div>

      <!-- Lista / Grilla de Platos -->
      <div class="carta-dishes-grid" id="carta-dishes-grid">
        <div class="text-center py-5 text-muted" style="grid-column: 1 / -1;">
          <div class="spinner-border spinner-border-sm text-warning mb-2" role="status"></div>
          <div>Cargando carta gastronómica...</div>
        </div>
      </div>
    </div>

    <!-- Barra Inferior Fija: "X items | Ver Carrito | S/ XX.XX" -->
    <div class="carta-bottom-bar" id="carta-bottom-bar" onclick="cartaApp.openCartModal()" role="button" tabindex="0">
      <div class="carta-cart-left">
        <span class="carta-items-pill" id="carta-items-pill">0 items</span>
        <span class="carta-cart-label">Ver Carrito</span>
      </div>
      <span class="carta-cart-total" id="carta-cart-total">S/ 0.00</span>
    </div>

    <!-- Modal: Detalle del Carrito y Envío de Pedido -->
    <div class="modal fade" id="cartaCartModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content rounded-4 border-0 shadow-lg">
          <div class="modal-header">
            <div>
              <h5 class="modal-title fw-bold mb-0">Tu Pedido en Carta</h5>
              <small class="text-muted">Revisa tus platos y envíalos directo a cocina</small>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="row g-2 mb-3">
              <div class="col-5">
                <label for="cart-modal-mesa" class="form-label-melidan small">Mesa *</label>
                <select id="cart-modal-mesa" class="form-select form-select-melidan form-select-sm"></select>
              </div>
              <div class="col-7">
                <label for="cart-modal-client" class="form-label-melidan small">Comensal / Referencia</label>
                <input type="text" id="cart-modal-client" class="form-control form-control-melidan form-control-sm" placeholder="Ej. Camila Torres">
              </div>
            </div>

            <div id="carta-cart-modal-items"></div>

            <div class="d-flex justify-content-between align-items-center pt-3 mt-2 border-top">
              <span class="fw-bold text-secondary">Total del Pedido:</span>
              <span class="fw-bold fs-4 text-melidan-orange" id="carta-modal-total">S/ 0.00</span>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="cartaApp.clearCart()">
              <i class="bi bi-trash3 me-1"></i> Vaciar
            </button>
            <button type="button" class="btn btn-melidan-orange px-4 fw-bold" id="btn-carta-submit-order" onclick="cartaApp.submitOrder()">
              <i class="bi bi-send-fill me-1"></i> Confirmar Pedido
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Selector Rápido de Mesa -->
    <div class="modal fade" id="cartaMesaModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content rounded-4 border-0 shadow-lg">
          <div class="modal-header py-2">
            <h6 class="modal-title fw-bold">Seleccionar Mesa</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="carta-mesa-grid" id="carta-mesa-grid"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/carta.js"></script>
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
</body>
</html>
