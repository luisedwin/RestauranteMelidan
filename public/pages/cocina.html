<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF5722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Melidan - Cocina (KDS)</title>
  <meta name="description" content="Sistema KDS de cocina para visualización y despacho de comandas en tiempo real.">

  <!-- Controlador Anti-FOUC de Tema Oscuro y Guardián RBAC -->
  <script src="/js/theme.js"></script>
  <script src="/js/rbac.js"></script>

  <!-- Fuentes Google: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/cocina.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>

  <!-- Contenedor Principal Expandido para Pantalla Táctil de Cocina -->
  <main class="app-container app-container-wide">

    <!-- Cabecera KDS con Reloj Digital -->
    <header class="kds-header">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="brand-logo" style="cursor: default;">Melidan<span class="dot">.</span></span>
        <span class="badge bg-danger text-white rounded-pill px-2 py-1 small">Cocina KDS</span>
        <span class="badge bg-light text-secondary border small d-none d-md-inline rbac-user-badge">Cocina</span>
      </div>

      <div class="d-flex align-items-center gap-2 gap-sm-3 flex-wrap">
        <div class="text-center d-none d-sm-block">
          <small class="text-muted d-block" style="font-size: 0.7rem;">HORA ACTUAL</small>
          <div class="kds-clock" id="kds-live-clock">12:00:00</div>
        </div>

        <button type="button" class="btn btn-sm btn-melidan-outline" onclick="cocinaApp.loadOrders(true)" title="Actualizar Comandas">
          <i class="bi bi-arrow-clockwise"></i>
          <span class="d-none d-md-inline">Actualizar</span>
        </button>

        <!-- Botón de Modo Oscuro -->
        <button type="button" class="theme-toggle-btn" title="Alternar Modo Oscuro" aria-label="Alternar Modo Oscuro">
          <i class="bi bi-moon-stars-fill"></i><span class="d-none d-sm-inline ms-1 small">Oscuro</span>
        </button>

        <a href="/login" class="btn btn-sm btn-outline-danger btn-logout-melidan" title="Cerrar Sesión">
          <i class="bi bi-box-arrow-right"></i>
          <span class="d-none d-md-inline ms-1">Salir</span>
        </a>
      </div>
    </header>

    <!-- Barra KDS: Estados clicables a la izquierda (Nuevas por defecto) + Filtro de Pedidos a la derecha -->
    <div class="station-filters" role="region" aria-label="Filtros de comandas de cocina">
      <div class="kds-status-tabs" role="tablist" aria-label="Estado de comandas">
        <button type="button" class="kds-status-btn status-pending active" data-status="pendiente" role="tab" aria-selected="true" id="kds-pending-count">
          <i class="bi bi-bell-fill"></i><span>0 Nuevas</span>
        </button>
        <button type="button" class="kds-status-btn status-cooking" data-status="en_cocina" role="tab" aria-selected="false" id="kds-cooking-count">
          <i class="bi bi-fire"></i><span>0 Cocinando</span>
        </button>
        <button type="button" class="kds-status-btn status-ready" data-status="listo" role="tab" aria-selected="false" id="kds-ready-count">
          <i class="bi bi-check-circle-fill"></i><span>0 Listas</span>
        </button>
        <span class="badge bg-dark text-white py-2 px-3 rounded-pill kds-active-total-badge" id="kds-active-count">0 Comandas</span>
      </div>

      <div class="kds-order-filters ms-auto">
        <div class="kds-filter-search-wrap">
          <i class="bi bi-search"></i>
          <input
            type="search"
            id="kds-order-search"
            class="kds-filter-input"
            placeholder="Filtrar mesa, #comanda o plato..."
            aria-label="Filtrar pedidos por mesa, comanda, cliente o plato"
          >
        </div>

        <select id="kds-station-select" class="kds-filter-select" aria-label="Filtrar por estación de cocina">
          <option value="todas" selected>Todas las estaciones</option>
          <option value="Wok">🔥 Wok</option>
          <option value="Horno">🍲 Horno / Fuego Lento</option>
          <option value="Entradas">🥗 Entradas / Fría</option>
          <option value="Bebidas">🥤 Bar y Bebidas</option>
          <option value="Postres">🍰 Postres</option>
        </select>

        <select id="kds-sort-select" class="kds-filter-select kds-filter-sort" aria-label="Ordenar pedidos">
          <option value="oldest" selected>Más antiguos</option>
          <option value="newest">Más recientes</option>
          <option value="mesa">Por N° de Mesa</option>
        </select>
      </div>
    </div>

    <!-- Grilla de Comandas en Vivo -->
    <div class="kds-grid" id="kds-tickets-grid"></div>

  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/cocina.js"></script>
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
</body>
</html>
